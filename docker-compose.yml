services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gametracker
      POSTGRES_PASSWORD: gametracker
      POSTGRES_DB: gametracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametracker -d gametracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
